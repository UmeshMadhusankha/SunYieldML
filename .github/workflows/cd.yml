name: CD
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.ENABLE_CD == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Require committed lockfiles before publication
        run: test -f frontend/package-lock.json && test -f backend/package-lock.json
      - name: Verify the tested commit is still main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)" = "$TESTED_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: release-frontend
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Image names
        id: names
        env:
          REPO: ${{ github.repository }}
        run: echo "prefix=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: api
        with:
          context: backend
          push: true
          tags: ${{ steps.names.outputs.prefix }}-backend:${{ github.event.workflow_run.head_sha }}
      - uses: docker/build-push-action@v6
        id: ml
        with:
          context: ml-service
          push: true
          tags: ${{ steps.names.outputs.prefix }}-ml:${{ github.event.workflow_run.head_sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy API and ML by immutable digest
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          API_IMAGE: ${{ steps.names.outputs.prefix }}-backend@${{ steps.api.outputs.digest }}
          ML_IMAGE: ${{ steps.names.outputs.prefix }}-ml@${{ steps.ml.outputs.digest }}
        run: |
          node scripts/ssm-parameters.cjs > ssm-parameters.json
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters file://ssm-parameters.json --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          test "$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text)" = Success
      - name: Publish tested frontend artifact
        env:
          BUCKET: ${{ vars.FRONTEND_BUCKET }}
          DISTRIBUTION: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws s3 sync release-frontend/assets "s3://$BUCKET/assets" --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp release-frontend/index.html "s3://$BUCKET/index.html" --cache-control 'no-cache' --content-type 'text/html'
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths /index.html /
      - name: Public readiness and authenticated smoke
        env:
          URL: ${{ vars.PUBLIC_URL }}
          EMAIL: ${{ secrets.SMOKE_EMAIL }}
          PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: node scripts/smoke.cjs
