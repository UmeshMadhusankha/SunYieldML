server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 location /api/ { proxy_pass http://backend:3001; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
 location /health/ { proxy_pass http://backend:3001; }
 location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
 location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
